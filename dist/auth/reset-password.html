<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Buat Password Baru — Kantoong</title>
  <script type="module" crossorigin src="/assets/resetPassword-D3Gt9nEw.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-vYFxeodt.js">
  <link rel="modulepreload" crossorigin href="/assets/password-rules-BefxxVvK.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-service-Bp4RrR2T.js">
  <link rel="stylesheet" crossorigin href="/assets/resetPassword-SR4flWEf.css">
</head>
<body>
    <!--
        Halaman tujuan link "Lupa password" dari email Supabase.
        Alamat ini WAJIB didaftarkan di Supabase: Authentication → URL Configuration → Redirect URLs.
    -->
    <main class="kr-page">
        <section class="kr-card" aria-labelledby="krTitle">
            <p class="kr-brand">KANTOONG</p>
            <h1 id="krTitle">Buat password baru</h1>
            <p class="kr-muted" id="krIntro">Memeriksa link dari email…</p>

            <form class="kr-form" id="krNewForm" hidden novalidate>
                <p class="kr-account" id="krAccount"></p>
                <label class="kr-field">
                    <span>Password baru</span>
                    <input id="krNew" type="password" autocomplete="new-password" required>
                </label>
                <label class="kr-field">
                    <span>Ulangi password baru</span>
                    <input id="krConfirm" type="password" autocomplete="new-password" required>
                </label>
                <label class="kr-check">
                    <input id="krShow" type="checkbox"> Tampilkan password
                </label>
                <p class="kr-hint">Minimal 8 karakter, berisi huruf dan angka.</p>
                <button class="kr-btn kr-btn--primary" type="submit">Simpan password baru</button>
            </form>

            <form class="kr-form" id="krRequestForm" hidden novalidate>
                <label class="kr-field">
                    <span>Email akunmu</span>
                    <input id="krEmail" type="email" autocomplete="username" required>
                </label>
                <button class="kr-btn kr-btn--primary" type="submit">Kirim link baru ke email</button>
            </form>

            <div class="kr-done" id="krDone" hidden>
                <a class="kr-btn kr-btn--primary" href="/">Ke toko</a>
                <a class="kr-btn" href="/erp/erp.html">Buka ERP</a>
            </div>

            <p class="kr-message" id="krMessage" role="status" aria-live="polite" hidden></p>
            <a class="kr-link" href="/">← Kembali ke toko</a>
        </section>
    </main>

</body>
</html>
