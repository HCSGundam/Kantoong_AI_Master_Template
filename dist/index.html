<body>
    <div class="mobile-container" id="appRoot">

        <!-- =========================================
             HEADER UTAMA
        ========================================== -->
        <header class="app-header">

            <!-- HAMBURGER: MEMBUKA DASHBOARD USER -->
            <button
                class="header-icon"
                id="showcaseMenuBtn"
                type="button"
                aria-label="Buka Dashboard User"
                aria-controls="kantoongDashboardHost"
                aria-expanded="false"
            >
                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linejoin="round"
                >
                    <!-- Ikon menu: empat kotak membulat (gaya dashboard) -->
                    <rect x="3" y="3" width="7.5" height="7" rx="2.2"></rect>
                    <rect x="3" y="12.5" width="7.5" height="8.5" rx="2.2"></rect>
                    <rect x="13.5" y="3" width="7.5" height="11" rx="2.2"></rect>
                    <rect x="13.5" y="16.5" width="7.5" height="4" rx="2"></rect>
                </svg>
            </button>

            <!-- NAMA BRAND -->
            <h1 class="header-title" id="brandTitle">
                BUSINESS NAME
            </h1>

            <div class="header-right">

                <!-- BAHASA (js/i18n.js) -->
                <button
                    class="header-icon header-lang"
                    type="button"
                    data-kc-lang-open
                    aria-label="Pilih bahasa / Language"
                    translate="no"
                >
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path>
                    </svg>
                    <span class="header-lang__code" data-kc-lang-code></span>
                </button>

                <!-- VIDEO FEED (menggantikan kaca pembesar; wadah kosong dulu — js/video-feed.js).
                     Cari produk tetap lewat Dashboard › Katalog Produk & asisten AI. -->
                <button
                    class="header-icon header-video"
                    id="btnVideo"
                    type="button"
                    aria-label="Video dari brand & kreator"
                >
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="5" y="2.5" width="14" height="19" rx="4"></rect>
                        <path d="M10.5 9.2v5.6l4.4-2.8z" fill="currentColor"></path>
                    </svg>
                </button>

                <!-- KERANJANG -->
                <button
                    class="header-icon"
                    id="btnCart"
                    type="button"
                    aria-label="Keranjang"
                >
                    <svg
                        width="21"
                        height="21"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M6 8h12l-1 12H7L6 8z"></path>
                        <path d="M9 8a3 3 0 0 1 6 0"></path>
                    </svg>

                    <span
                        class="cart-badge"
                        id="cartCount"
                        hidden
                    >0</span>
                </button>

            </div>
        </header>

        <!-- =========================================
             HOMEPAGE / STOREFRONT
        ========================================== -->
        <main class="page-scroll" id="pageScroll">

            <!-- HERO -->
            <section
                class="hero"
                id="heroSection"
                aria-label="Sorotan toko"
            >
                <div
                    class="hero-track scroll-x"
                    id="heroTrack"
                ></div>

                <div
                    class="hero-dots"
                    id="heroDots"
                    aria-hidden="true"
                ></div>
            </section>

            <!-- INFORMASI BRAND: pita berjalan keunggulan / logo brand -->
            <section
                class="brand-slot"
                id="brandSlot"
                aria-label="Informasi brand"
            ></section>

            <!-- PRODUK UNGGULAN -->
            <section
                class="page-section featured"
                id="featuredSection"
                data-layout="start"
            >
                <!-- Tulisan unggulan "melompat memutar" mengikuti geseran:
                     kiri (awal) -> atas (tengah) -> kanan (ujung).
                     Di mode 3D tulisan diam di kiri. Posisi dihitung engine.js. -->
                <div class="featured-head" aria-hidden="true"></div>

                <div class="featured-float" id="featuredFloat">
                    <p class="featured-float__eyebrow" id="featuredEyebrow">
                        Produk unggulan
                    </p>

                    <h2 id="featuredTitle">
                        Produk Unggulan
                    </h2>

                    <p class="featured-float__text" id="featuredText" hidden></p>

                    <button
                        class="featured-reset"
                        id="resetCatalogBtn"
                        type="button"
                        hidden
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
                        <span>Kembali ke awal</span>
                    </button>
                </div>

                <button
                    class="featured-float-cta"
                    id="featuredExplore"
                    type="button"
                >
                    Cek semuanya &rarr;
                </button>

                <div class="featured-stage">
                    <div
                        class="rail scroll-x featured-rail"
                        id="featuredRail"
                    ></div>

                    <!-- Panah ke produk berikutnya -->
                    <button
                        class="featured-next"
                        id="featuredNext"
                        type="button"
                        aria-label="Produk berikutnya"
                        hidden
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>

                <!-- Tombol 2D/3D + titik posisi -->
                <div class="featured-controls" hidden>
                    <button
                        class="featured-view"
                        id="featuredViewToggle"
                        type="button"
                        aria-pressed="true"
                    >
                        3D
                    </button>

                    <div class="featured-dots" id="featuredDots" aria-hidden="true"></div>
                </div>
            </section>

            <!-- BARIS GESER LAIN (Best Seller, Wishlist, Terbaru, dst.)
                 Diatur di client-config.js -> rails. Baris tanpa data asli
                 otomatis disembunyikan. -->
            <div id="extraRails"></div>

            <!-- ZONA PROMOSI: banner, kupon, kotak misteri, poster, produk pilihan.
                 Diatur di ERP › Etalase & Brand › Homepage (js/home-promos.js). -->
            <section
                class="page-section kc-promo"
                id="homePromos"
                aria-label="Promo & penawaran"
            ></section>

            <!-- Katalog lengkap pindah ke Dashboard User › Katalog Produk.
                 Bagian lama disembunyikan (dipertahankan agar kode lama tetap aman). -->
            <section
                class="page-section"
                id="categorySection"
                aria-label="Katalog semua produk"
                hidden
            >
                <div class="section-head">
                    <h2 id="catalogTitle">Semua Produk</h2>
                </div>

                <!-- DERETAN KATEGORI: pil geser untuk menyaring katalog -->
                <nav class="category-strip" aria-label="Kategori produk">
                    <div class="scroll-x" id="categoryList"></div>
                </nav>

                <div class="catalog-grid" id="catalogGrid"></div>
            </section>

            <!-- KATA PEMBELI (testimoni asli dari client-config.js) -->
            <section
                class="page-section"
                id="testimonialSection"
                aria-label="Ulasan pembeli"
                hidden
            >
                <div class="section-head">
                    <h2>Kata Mereka</h2>
                </div>
                <div class="testimonial-list scroll-x" id="testimonialList"></div>
            </section>

            <!-- FOOTER: kontak & kebijakan (diatur di ERP › Etalase & Brand › Info toko) -->
            <footer class="kc-footer" id="storeFooter" aria-label="Info toko"></footer>
        </main>

        <!-- =========================================
             HOST DASHBOARD USER
             Dashboard dimuat oleh engine.js
             melalui iframe dari folder dashboard-user.
        ========================================== -->
        <div
            id="kantoongDashboardHost"
            hidden
            aria-hidden="true"
        ></div>

        <!-- =========================================
             HOST KOMPONEN DINAMIS
        ========================================== -->
        <div id="dynamicComponentContainer"></div>

        <!-- PANEL CHAT AI: dipasang otomatis oleh js/kantoong-assistant.js
             (markup ada di js/assistant-markup.js, sama di semua halaman). -->

    </div>

    <!-- =============================================
         KONFIGURASI APLIKASI
    ============================================== -->

    <!-- =============================================
         ASISTEN AI KANTOONG (chat yang sama di semua halaman & brand)
    ============================================== -->

         Mengatur storefront, data, event, keranjang,
         dan pembukaan Dashboard User.
    ============================================== -->

         KERANJANG
    ============================================== -->

</body>
</html>
