
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">

    <title id="pageTitle">Kantoong AI - Master Template</title>

    <!-- CSS GLOBAL -->

    <!-- CSS STOREFRONT -->

    <!-- CSS HOST DASHBOARD USER -->

    <!-- CSS CHAT AI -->

    <!-- Ukuran ringkas ala marketplace (dimuat paling akhir) -->

    <!-- GOOGLE IDENTITY SERVICES -->
    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer
    ></script>
  <script type="module" crossorigin src="/assets/homepage-yQ43CzgN.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/client-config-60D0gHsc.js">
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-vYFxeodt.js">
  <link rel="stylesheet" crossorigin href="/assets/homepage-kF94E3sb.css">
</head>

<body>
    <div class="mobile-container" id="appRoot">

        <!-- =========================================
             HEADER UTAMA
        ========================================== -->
        <header class="app-header">

            <!-- HAMBURGER: MEMBUKA DASHBOARD USER -->
            <button
                class="header-icon"
                id="showcaseMenuBtn"
                type="button"
                aria-label="Buka Dashboard User"
                aria-controls="kantoongDashboardHost"
                aria-expanded="false"
            >
                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linejoin="round"
                >
                    <!-- Ikon menu: empat kotak membulat (gaya dashboard) -->
                    <rect x="3" y="3" width="7.5" height="7" rx="2.2"></rect>
                    <rect x="3" y="12.5" width="7.5" height="8.5" rx="2.2"></rect>
                    <rect x="13.5" y="3" width="7.5" height="11" rx="2.2"></rect>
                    <rect x="13.5" y="16.5" width="7.5" height="4" rx="2"></rect>
                </svg>
            </button>

            <!-- NAMA BRAND -->
            <h1 class="header-title" id="brandTitle">
                BUSINESS NAME
            </h1>

            <div class="header-right">

                <!-- PENCARIAN -->
                <button
                    class="header-icon"
                    id="btnSearch"
                    type="button"
                    aria-label="Cari produk lewat AI"
                >
                    <svg
                        width="21"
                        height="21"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    >
                        <circle cx="11" cy="11" r="7"></circle>
                        <line
                            x1="21"
                            y1="21"
                            x2="16.65"
                            y2="16.65"
                        ></line>
                    </svg>
                </button>

                <!-- KERANJANG -->
                <button
                    class="header-icon"
                    id="btnCart"
                    type="button"
                    aria-label="Keranjang"
                >
                    <svg
                        width="21"
                        height="21"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M6 8h12l-1 12H7L6 8z"></path>
                        <path d="M9 8a3 3 0 0 1 6 0"></path>
                    </svg>

                    <span
                        class="cart-badge"
                        id="cartCount"
                        hidden
                    >0</span>
                </button>

            </div>
        </header>

        <!-- =========================================
             HOMEPAGE / STOREFRONT
        ========================================== -->
        <main class="page-scroll" id="pageScroll">

            <!-- HERO -->
            <section
                class="hero"
                id="heroSection"
                aria-label="Sorotan toko"
            >
                <div
                    class="hero-track scroll-x"
                    id="heroTrack"
                ></div>

                <div
                    class="hero-dots"
                    id="heroDots"
                    aria-hidden="true"
                ></div>
            </section>

            <!-- INFORMASI BRAND: pita berjalan keunggulan / logo brand -->
            <section
                class="brand-slot"
                id="brandSlot"
                aria-label="Informasi brand"
            ></section>

            <!-- PRODUK UNGGULAN -->
            <section
                class="page-section featured"
                id="featuredSection"
                data-layout="start"
            >
                <!-- Tulisan unggulan "melompat memutar" mengikuti geseran:
                     kiri (awal) -> atas (tengah) -> kanan (ujung).
                     Di mode 3D tulisan diam di kiri. Posisi dihitung engine.js. -->
                <div class="featured-head" aria-hidden="true"></div>

                <div class="featured-float" id="featuredFloat">
                    <p class="featured-float__eyebrow" id="featuredEyebrow">
                        Produk unggulan
                    </p>

                    <h2 id="featuredTitle">
                        Produk Unggulan
                    </h2>

                    <p class="featured-float__text" id="featuredText" hidden></p>

                    <button
                        class="section-link"
                        id="resetCatalogBtn"
                        type="button"
                        hidden
                    >
                        Kembali ke awal
                    </button>
                </div>

                <button
                    class="featured-float-cta"
                    id="featuredExplore"
                    type="button"
                >
                    Jelajahi sekarang &rarr;
                </button>

                <div class="featured-stage">
                    <div
                        class="rail scroll-x featured-rail"
                        id="featuredRail"
                    ></div>

                    <!-- Panah ke produk berikutnya -->
                    <button
                        class="featured-next"
                        id="featuredNext"
                        type="button"
                        aria-label="Produk berikutnya"
                        hidden
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>

                <!-- Tombol 2D/3D + titik posisi -->
                <div class="featured-controls" hidden>
                    <button
                        class="featured-view"
                        id="featuredViewToggle"
                        type="button"
                        aria-pressed="true"
                    >
                        3D
                    </button>

                    <div class="featured-dots" id="featuredDots" aria-hidden="true"></div>
                </div>
            </section>

            <!-- BARIS GESER LAIN (Best Seller, Wishlist, Terbaru, dst.)
                 Diatur di client-config.js -> rails. Baris tanpa data asli
                 otomatis disembunyikan. -->
            <div id="extraRails"></div>

            <!-- KATALOG PUSAT: semua produk brand, tampil ke bawah -->
            <section
                class="page-section"
                id="categorySection"
                aria-label="Katalog semua produk"
            >
                <div class="section-head">
                    <h2 id="catalogTitle">Semua Produk</h2>
                </div>

                <!-- DERETAN KATEGORI: pil geser untuk menyaring katalog -->
                <nav class="category-strip" aria-label="Kategori produk">
                    <div class="scroll-x" id="categoryList"></div>
                </nav>

                <div class="catalog-grid" id="catalogGrid"></div>
            </section>

            <!-- KATA PEMBELI (testimoni asli dari client-config.js) -->
            <section
                class="page-section"
                id="testimonialSection"
                aria-label="Ulasan pembeli"
                hidden
            >
                <div class="section-head">
                    <h2>Kata Mereka</h2>
                </div>
                <div class="testimonial-list scroll-x" id="testimonialList"></div>
            </section>

        </main>

        <!-- =========================================
             HOST DASHBOARD USER
             Dashboard dimuat oleh engine.js
             melalui iframe dari folder dashboard-user.
        ========================================== -->
        <div
            id="kantoongDashboardHost"
            hidden
            aria-hidden="true"
        ></div>

        <!-- =========================================
             HOST KOMPONEN DINAMIS
        ========================================== -->
        <div id="dynamicComponentContainer"></div>

        <!-- =========================================
             PANEL CHAT AI
        ========================================== -->
        <aside
            class="kc-sheet"
            id="chatPanel"
            aria-label="Konsultasi AI"
            data-state="peek"
            data-open="false"
        >

            <!-- Bagian yang bisa ditahan lalu digeser naik-turun -->
            <div class="kc-sheet__grab" id="panelHead">

                <div class="kc-sheet__handle" aria-hidden="true"></div>

                <!-- Posisi peek: sambutan AI -->
                <div class="kc-peek" id="peekRow">
                    <!-- Ketuk orb: kotak mengecil jadi orb melayang di tepi layar -->
                    <span
                        class="kc-orb kc-peek__orb"
                        id="peekOrb"
                        role="button"
                        tabindex="0"
                        aria-label="Kecilkan jadi orb"
                    ></span>

                    <div class="kc-peek__text">
                        <strong id="peekTitle">Halo Kak!</strong>
                        <p id="peekGreeting">
                            Mau cari produk yang cocok untuk kebutuhanmu?
                        </p>
                    </div>

                    <button
                        class="kc-send"
                        id="peekSendBtn"
                        type="button"
                        aria-label="Mulai konsultasi"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                    </button>
                </div>

                <!-- Posisi terbuka: judul dan tombol turunkan -->
                <div class="kc-chatbar">
                    <h2>Konsultasi AI</h2>

                    <button
                        class="kc-icon-btn"
                        id="chatCloseBtn"
                        type="button"
                        aria-label="Turunkan chat"
                        aria-expanded="false"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                </div>

            </div>

            <!-- Percakapan -->
            <div
                class="kc-messages"
                id="chatBox"
                role="log"
                aria-live="polite"
                aria-relevant="additions"
            ></div>

            <!-- Saran pertanyaan: 3 chip, hanya sebelum chat pertama hari ini -->
            <div
                class="kc-suggestions"
                id="chatSuggestions"
                aria-label="Saran pertanyaan"
            ></div>

            <!-- Kotak ketik bergaya asisten AI -->
            <div class="kc-composer" id="kcComposer" data-mode="chat">

                <div class="kc-attachments" id="kcAttachments" hidden></div>

                <!-- Bar ketik, dua keadaan (data-typing di #kcComposer):
                     DIAM     : [kirim | Tulis Context]  suara  link  lampiran | saran
                     MENGETIK : [+ | Tulis Context ........ mic]  (kirim)
                     Saat mengetik, semua fitur pindah ke menu +. -->
                <div class="kc-composer__row">

                    <div class="kc-composer__box">

                        <!-- Hanya saat DIAM: ikon kirim (mengetuknya = mulai mengetik) -->
                        <!-- Bar DIAM: tombol + bulat hitam -> menu Chat baru & Anachronos Mode -->
                        <div class="kc-start-wrap">
                            <button
                                class="kc-send kc-send--idle"
                                id="kcIdleSend"
                                type="button"
                                aria-label="Menu chat"
                                aria-haspopup="menu"
                                aria-expanded="false"
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
                            </button>

                            <div class="kc-menu kc-menu--start" id="kcStartMenu" role="menu" hidden>
                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="new-chat">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
                                    Chat baru
                                </button>

                                <!-- Konsep sedang disiapkan owner: abu-abu, belum bisa dipilih -->
                                <button class="kc-menu__item kc-menu__item--anachronos" type="button" role="menuitem" data-kc-action="anachronos-mode" disabled>
                                    <svg class="kc-anachronos-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <path class="kc-anachronos-icon__star" d="M12 1.5C12.9 7.8 16.2 11.1 22.5 12C16.2 12.9 12.9 16.2 12 22.5C11.1 16.2 7.8 12.9 1.5 12C7.8 11.1 11.1 7.8 12 1.5Z"/>
                                        <path class="kc-anachronos-icon__infinity" d="M12 12c-.75-.95-1.35-1.45-2.05-1.45a1.45 1.45 0 0 0 0 2.9c.7 0 1.3-.5 2.05-1.45zm0 0c.75.95 1.35 1.45 2.05 1.45a1.45 1.45 0 0 0 0-2.9c-.7 0-1.3.5-2.05 1.45z"/>
                                    </svg>
                                    ANACHRONOS MODE
                                    <span class="kc-menu__tag">Segera</span>
                                </button>
                            </div>
                        </div>

                        <!-- Hanya saat MENGETIK: tombol + berisi semua fitur -->
                        <div class="kc-plus">
                            <button
                                class="kc-tool kc-tool--plus"
                                id="btnPlus"
                                type="button"
                                aria-label="Tambah lampiran atau opsi lain"
                                aria-haspopup="menu"
                                aria-expanded="false"
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
                            </button>

                            <div class="kc-menu" id="kcPlusMenu" role="menu" hidden>

                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="attach-file">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.5l-8.5 8.5a5 5 0 0 1-7-7L14 5.500a3.500 3.500 0 0 1 5 5L10.500 19a2 2 0 0 1-3-3L15 8.500"/></svg>
                                    Foto atau dokumen
                                </button>

                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="attach-video">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h12v10H3zM15 11l6-3v8l-6-3"/></svg>
                                    Video
                                </button>

                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="new-chat">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                                    Chat baru
                                </button>

                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="insert-link">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
                                    Sisipkan link
                                </button>

                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="suggest">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="6" width="14" height="11" rx="3"/><path d="M12 6V3M9.500 11v1M14.500 11v1M3 11v2M21 11v2M10 20l2-3 2 3"/></svg>
                                    Saran chat
                                </button>

                                <button class="kc-menu__item" id="kcAgentItem" type="button" role="menuitem" data-kc-action="agent-toggle" disabled>
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="M9 11v2M15 11v2"/></svg>
                                    Mode agen
                                    <span class="kc-menu__tag">Segera</span>
                                </button>

                            </div>
                        </div>

                        <textarea
                            id="kolomKetik"
                            rows="1"
                            placeholder="Tulis Context"
                            aria-label="Ketik pesan"
                            enterkeyhint="send"
                            autocomplete="off"
                        ></textarea>

                        <!-- Hanya saat MENGETIK: mic di dalam kolom -->
                        <button
                            class="kc-tool kc-tool--mic"
                            id="btnMic"
                            type="button"
                            aria-label="Input suara (segera hadir)"
                            disabled
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
                        </button>

                        <!-- Mode agen (infrastruktur): orb menggantikan kolom ketik -->
                        <button
                            class="kc-agent"
                            id="kcAgentOrb"
                            type="button"
                            aria-label="Matikan mode agen dan kembali mengetik"
                        >
                            <span class="kc-orb" aria-hidden="true"></span>
                            <span class="kc-agent__text">
                                Mode agen aktif
                                <small>Ketuk untuk kembali mengetik</small>
                            </span>
                        </button>
                    </div>

                    <!-- Hanya saat DIAM: ikon alat di kanan -->
                    <div class="kc-composer__tools">
                        <button
                            class="kc-tool"
                            id="btnVoice"
                            type="button"
                            aria-label="Input suara (segera hadir)"
                            disabled
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
                        </button>

                        <button
                            class="kc-tool"
                            id="btnLink"
                            type="button"
                            aria-label="Sisipkan link"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
                        </button>

                        <!-- Peniti: pilih foto/dokumen, kamera, atau video -->
                        <div class="kc-attach-wrap">
                            <button
                                class="kc-tool"
                                id="btnAttach"
                                type="button"
                                aria-label="Lampirkan foto, kamera, atau video"
                                aria-haspopup="menu"
                                aria-expanded="false"
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.5l-8.5 8.5a5 5 0 0 1-7-7L14 5.500a3.500 3.500 0 0 1 5 5L10.500 19a2 2 0 0 1-3-3L15 8.500"/></svg>
                            </button>

                            <div class="kc-menu kc-menu--attach" id="kcAttachMenu" role="menu" hidden>
                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="attach-file">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4"/></svg>
                                    Foto atau dokumen
                                </button>

                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="attach-camera">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.500"/></svg>
                                    Kamera
                                </button>

                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="attach-video">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h12v10H3zM15 11l6-3v8l-6-3"/></svg>
                                    Video
                                </button>
                            </div>
                        </div>

                        <span class="kc-tools__divider" aria-hidden="true"></span>

                        <!-- Saran chat: muncul hanya saat ikon ini dipencet -->
                        <button
                            class="kc-tool"
                            id="btnSuggest"
                            type="button"
                            aria-label="Tampilkan saran chat"
                            aria-pressed="false"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="6" width="14" height="11" rx="3"/><path d="M12 6V3M9.500 11v1M14.500 11v1M3 11v2M21 11v2M10 20l2-3 2 3"/></svg>
                        </button>
                    </div>

                    <!-- Hanya saat MENGETIK: tombol kirim hitam di luar kolom -->
                    <button
                        class="kc-send kc-send--main"
                        id="tombolKirim"
                        type="button"
                        aria-label="Kirim pesan"
                        disabled
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></svg>
                    </button>

                </div>

                <input type="file" id="kcFileInput" multiple hidden>

            </div>

        </aside>

    </div>

    <!-- =============================================
         KONFIGURASI APLIKASI
    ============================================== -->

    <!-- =============================================
         AI BRAIN
    ============================================== -->

    <!-- =============================================

    ============================================== -->

    <!-- =============================================
         CORE ENGINE
         Mengatur storefront, data, event, keranjang,
         dan pembukaan Dashboard User.
    ============================================== -->

    <!-- =============================================
         KERANJANG
    ============================================== -->

</body>
</html>
