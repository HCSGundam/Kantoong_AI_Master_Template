<div class="admin-modal" style="position: absolute; inset: 0; background: #ffffff; z-index: 99999; padding: 24px; display: flex; flex-direction: column; overflow-y: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="font-size: 18px; font-weight: bold; color: #1d1d1f;" id="adminModalTitle">🔐 Portal Verifikasi Admin</h3>
        <button id="closeAdminModal" style="background: transparent; border: 1px solid #ccc; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button>
    </div>

    <!-- TAMPILAN 1: GOOGLE SIGN-IN RESMI (PILIH AKUN GMAIL) -->
    <div id="adminLoginView" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; margin-top: 40px; text-align: center;">
        <p style="font-size: 13px; color: #666; max-width: 280px; line-height: 1.4;">Silakan masuk menggunakan akun Google resmi Anda untuk memverifikasi akses pengelola toko:</p>
        
        <!-- Wadah Tombol Google Sign-In (Pop-up Gmail) -->
        <div id="g_id_signin" style="margin-top: 10px;"></div>
    </div>

    <!-- TAMPILAN 2: DASHBOARD UTAMA (SETELAH LOLOS WHITELIST SERVER.JS) -->
    <div id="adminDashboardView" style="display: none; flex-direction: column; gap: 12px;">
        <div style="background: #e8f5e9; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <p style="font-size: 11px; color: #2e7d32; font-weight: bold;">STATUS: ADMIN TERVERIFIKASI ✅</p>
                <p style="font-size: 13px; color: #1d1d1f; font-weight: 600;" id="loggedInEmailText">-</p>
            </div>
            <button id="adminLogoutBtn" style="background: #ffebee; color: #c62828; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px;">Keluar</button>
        </div>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 4px 0;">

        <h4 style="font-size: 14px; font-weight: bold; color: #333;">➕ Tambah Produk Katalog</h4>
        <input type="text" id="adminProdName" placeholder="Nama Produk" style="padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;">
        <input type="text" id="adminProdCategory" placeholder="Kategori (Contoh: Perhiasan)" style="padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;">
        <input type="number" id="adminProdPrice" placeholder="Harga (Angka)" style="padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;">
        <input type="number" id="adminProdStock" placeholder="Stok Tersedia" style="padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;">
        <textarea id="adminProdDesc" placeholder="Deskripsi singkat produk..." style="padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; resize: none; height: 60px;"></textarea>
        <input type="text" id="adminProdImage" placeholder="URL Foto Produk (Opsional)" style="padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;">
        
        <button id="adminSaveBtn" style="background: #111; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 6px;">Simpan & Publikasikan Produk</button>
    </div>
</div>

<!-- SDK Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
    const savedEmail = localStorage.getItem('kantong_admin_email');
    const loginView = document.getElementById('adminLoginView');
    const dashboardView = document.getElementById('adminDashboardView');
    const loggedInEmailText = document.getElementById('loggedInEmailText');
    const modalTitle = document.getElementById('adminModalTitle');

    // Jika browser sudah pernah nyimpen sesi, langsung verifikasi ke backend
    if (savedEmail) {
        verifyAndOpen(savedEmail);
    } else {
        // Panggil inisialisasi tombol Google Sign-In setelah skrip siap
        setTimeout(initGoogleSignIn, 400);
    }

    async function verifyAndOpen(email) {
        try {
            const response = await fetch('http://localhost:5000/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const result = await response.json();

            if (result.success) {
                localStorage.setItem('kantong_admin_email', email);
                loginView.style.display = 'none';
                dashboardView.style.display = 'flex';
                modalTitle.textContent = '✨ Dashboard Admin Toko';
                loggedInEmailText.textContent = email;

                const drawerAdminBtn = window.parent.document.getElementById('drawerAdminBtn');
                if (drawerAdminBtn) drawerAdminBtn.style.display = 'block';
            } else {
                alert(result.message);
                localStorage.removeItem('kantong_admin_email');
                loginView.style.display = 'flex';
                dashboardView.style.display = 'none';
                initGoogleSignIn();
            }
        } catch (err) {
            alert('Gagal terhubung ke server backend lokal.');
        }
    }

    // Inisialisasi Tombol Google Sign-In Resmi
    function initGoogleSignIn() {
        if (typeof google !== 'undefined') {
            google.accounts.id.initialize({
                // 👇 TEMPEL CLIENT ID GOOGLE CLOUD KAMU DI SINI 👇
                client_id: "153262298610-rrhi1e6mlqlg553vri7ig7k9po2buulm.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("g_id_signin"),
                { theme: "outline", size: "large", width: "250", text: "signin_with" }
            );
        } else {
            setTimeout(initGoogleSignIn, 500);
        }
    }

    // Tangkap Respon Token dari Pop-up Google
    async function handleCredentialResponse(response) {
        const responsePayload = decodeJwtResponse(response.credential);
        const email = responsePayload.email;
        await verifyAndOpen(email);
    }

    // Decoder Token JWT dari Google
    function decodeJwtResponse(token) {
        let base64Url = token.split('.')[1];
        let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
            return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    // Tombol Logout
    document.getElementById('adminLogoutBtn').addEventListener('click', () => {
        localStorage.removeItem('kantong_admin_email');
        alert('Sesi admin diakhiri.');
        const drawerAdminBtn = window.parent.document.getElementById('drawerAdminBtn');
        if (drawerAdminBtn) drawerAdminBtn.style.display = 'none';
        document.getElementById('dynamicComponentContainer').innerHTML = '';
    });

    // Tombol Tutup Modal
    document.getElementById('closeAdminModal').addEventListener('click', () => {
        document.getElementById('dynamicComponentContainer').innerHTML = '';
    });

    // Tombol Simpan Produk
    const saveBtn = document.getElementById('adminSaveBtn');
    if (saveBtn) {
        saveBtn.addEventListener('click', async () => {
            const product = {
                name: document.getElementById('adminProdName').value,
                category: document.getElementById('adminProdCategory').value,
                price: document.getElementById('adminProdPrice').value,
                stock: document.getElementById('adminProdStock').value,
                description: document.getElementById('adminProdDesc').value,
                image: document.getElementById('adminProdImage').value
            };

            if (!product.name || !product.price) {
                return alert('Nama produk dan harga wajib diisi!');
            }

            const email = localStorage.getItem('kantong_admin_email');

            try {
                const response = await fetch('http://localhost:5000/api/admin/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, product })
                });
                const result = await response.json();

                if (result.success) {
                    alert('Produk berhasil disimpan ke katalog!');
                    document.getElementById('adminProdName').value = '';
                    document.getElementById('adminProdCategory').value = '';
                    document.getElementById('adminProdPrice').value = '';
                    document.getElementById('adminProdStock').value = '';
                    document.getElementById('adminProdDesc').value = '';
                    document.getElementById('adminProdImage').value = '';
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert('Gagal menyimpan produk.');
            }
        });
    }
</script>
