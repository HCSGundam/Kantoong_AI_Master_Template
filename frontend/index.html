<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Kantoong AI - Master Template</title>
    
    <!-- CSS Modular -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/chat-bubble.css">
    <link rel="stylesheet" href="css/chat-panel.css">
    <link rel="stylesheet" href="css/input-bar.css">
    <link rel="stylesheet" href="css/animation.css">

    <!-- Google Identity Services (Google OAuth / Sign-In Resmi) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="mobile-container">
        <!-- Header Navigasi -->
        <header class="app-header">
            <div class="header-icon" id="showcaseMenuBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                <span id="menuLabel">Menu</span>
            </div>
            <div class="header-title" id="brandTitle">BUSINESS NAME</div>
            <div class="header-right">
                <div class="header-icon" id="btnPriceModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    <span id="priceLabel">Harga</span>
                </div>
            </div>
        </header>

        <!-- Laci Sampel Komponen / Menu Utama -->
        <div id="sampleDrawer" class="sample-drawer" style="display: none;">
            <div class="drawer-header">
                <h3>✨ Menu Utama & Fitur</h3>
                <button id="closeDrawer" class="btn-close-drawer">✕</button>
            </div>
            <p class="drawer-desc" style="color: #666; font-size: 13px;">Pilih modul atau fitur toko:</p>
            
            <!-- Tombol Admin / Customer Adaptif (Otomatis Berubah Wujud) -->
            <button class="sample-item-btn" id="drawerAdminBtn" style="display: none; background: #111; color: #e5c07b; border-color: #111; font-weight: bold;">
                🔐 Masuk ke Dashboard Admin
            </button>

            <button class="sample-item-btn" id="drawerCustomerBtn" style="background: #f5f5f7; color: #1d1d1f; border-color: #d2d2d7; font-weight: 600;">
                👤 Masuk / Akun Customer
            </button>

            <button class="sample-item-btn" data-component="gold-price-modal.html">
                🪙 Modul: Harga Emas & Perak Real-Time
            </button>
            
            <button class="sample-item-btn" id="btnOpenCatalog">
                🛍️ Katalog Produk Toko
            </button>
        </div>

        <!-- Panel Chat Melayang (Glassmorphism + Drag) -->
        <div class="chat-panel panel-half" id="chatPanel">
            <!-- Pegangan Tarik (Drag Handle) -->
            <div class="drag-handle" id="dragHandle"></div>

            <div class="chat-header">
                <h2 id="chatHeading">Chat</h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
            </div>

            <!-- Kotak Pesan Chat -->
            <div class="chat-box" id="chatBox"></div>

            <!-- Bar Ketik Pesan Utama di Dalam Panel -->
            <div class="input-bar-container">
                <div class="input-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    <textarea id="kolomKetik" rows="1" placeholder="Ketik pesan..."></textarea>
                    <svg class="icon-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                </div>
                <button class="send-btn" id="tombolKirim">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>

        <!-- Tombol AI Orb Bulat di Bawah -->
        <div class="logo-btn-bulat" id="logoBtn">
            <div id="logoText" class="ai-eyes">
                <div class="eye"></div><div class="eye"></div>
            </div>
            <div id="logoDots" class="listening-dots" style="display: none;">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>

        <!-- Floating Input Bar -->
        <div id="floatingInputBar">
            <div class="floating-input-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                <textarea id="kolomKetikFloating" rows="1" placeholder="Ketik pesan..."></textarea>
            </div>
            <button id="tombolKirimFloating">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>

        <!-- Kontainer Dinamis Komponen -->
        <div id="dynamicComponentContainer"></div>
    </div>

    <!-- Script Utama -->
    <script src="client-config.js"></script>
    <script src="js/ai-brain.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
