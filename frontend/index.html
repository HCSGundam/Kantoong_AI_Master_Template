
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">

    <title id="pageTitle">Kantoong AI - Master Template</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="./css/global.css">

    <!-- CSS STOREFRONT -->
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/store-front.css">
    <link rel="stylesheet" href="./css/products.css">
    <link rel="stylesheet" href="./css/homepage.css">
    <link rel="stylesheet" href="./css/modal-popup.css">

    <!-- CSS HOST DASHBOARD USER -->
    <link rel="stylesheet" href="./css/dashboard-host.css">

    <!-- CSS CHAT AI -->
    <link rel="stylesheet" href="./css/chat-bubble.css">
    <link rel="stylesheet" href="./css/chat-panel.css">
    <link rel="stylesheet" href="./css/input-bar.css">
    <link rel="stylesheet" href="./css/animation.css">
    <link rel="stylesheet" href="./css/chat-sheet.css">

    <!-- GOOGLE IDENTITY SERVICES -->
    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer
    ></script>
</head>

<body>
    <div class="mobile-container" id="appRoot">

        <!-- =========================================
             HEADER UTAMA
        ========================================== -->
        <header class="app-header">

            <!-- HAMBURGER: MEMBUKA DASHBOARD USER -->
            <button
                class="header-icon"
                id="showcaseMenuBtn"
                type="button"
                aria-label="Buka Dashboard User"
                aria-controls="kantoongDashboardHost"
                aria-expanded="false"
            >
                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                >
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <!-- NAMA BRAND -->
            <h1 class="header-title" id="brandTitle">
                BUSINESS NAME
            </h1>

            <div class="header-right">

                <!-- PENCARIAN -->
                <button
                    class="header-icon"
                    id="btnSearch"
                    type="button"
                    aria-label="Cari produk lewat AI"
                >
                    <svg
                        width="21"
                        height="21"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    >
                        <circle cx="11" cy="11" r="7"></circle>
                        <line
                            x1="21"
                            y1="21"
                            x2="16.65"
                            y2="16.65"
                        ></line>
                    </svg>
                </button>

                <!-- KERANJANG -->
                <button
                    class="header-icon"
                    id="btnCart"
                    type="button"
                    aria-label="Keranjang"
                >
                    <svg
                        width="21"
                        height="21"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M6 8h12l-1 12H7L6 8z"></path>
                        <path d="M9 8a3 3 0 0 1 6 0"></path>
                    </svg>

                    <span
                        class="cart-badge"
                        id="cartCount"
                        hidden
                    >0</span>
                </button>

            </div>
        </header>

        <!-- =========================================
             HOMEPAGE / STOREFRONT
        ========================================== -->
        <main class="page-scroll" id="pageScroll">

            <!-- HERO -->
            <section
                class="hero"
                id="heroSection"
                aria-label="Sorotan toko"
            >
                <div
                    class="hero-track scroll-x"
                    id="heroTrack"
                ></div>

                <div
                    class="hero-dots"
                    id="heroDots"
                    aria-hidden="true"
                ></div>
            </section>

            <!-- INFORMASI BRAND -->
            <section
                class="brand-slot"
                id="brandSlot"
                aria-label="Informasi brand"
            ></section>

            <!-- PRODUK UNGGULAN -->
            <section
                class="page-section"
                id="featuredSection"
            >
                <div class="section-head">
                    <h2 id="featuredTitle">
                        Produk Unggulan
                    </h2>

                    <button
                        class="section-link"
                        id="resetCatalogBtn"
                        type="button"
                        hidden
                    >
                        Kembali ke awal
                    </button>
                </div>

                <div
                    class="rail scroll-x"
                    id="featuredRail"
                ></div>
            </section>

            <!-- KATEGORI PRODUK -->
            <section
                class="page-section"
                id="categorySection"
                aria-label="Kategori produk"
            >
                <div id="categoryList"></div>
            </section>

        </main>

        <!-- =========================================
             HOST DASHBOARD USER
             Dashboard dimuat oleh engine.js
             melalui iframe dari folder dashboard-user.
        ========================================== -->
        <div
            id="kantoongDashboardHost"
            hidden
            aria-hidden="true"
        ></div>

        <!-- =========================================
             HOST KOMPONEN DINAMIS
        ========================================== -->
        <div id="dynamicComponentContainer"></div>

        <!-- =========================================
             PANEL CHAT AI
        ========================================== -->
        <aside
            class="kc-sheet"
            id="chatPanel"
            aria-label="Konsultasi AI"
            data-state="peek"
            data-open="false"
        >

            <!-- Bagian yang bisa ditahan lalu digeser naik-turun -->
            <div class="kc-sheet__grab" id="panelHead">

                <div class="kc-sheet__handle" aria-hidden="true"></div>

                <!-- Posisi peek: sambutan AI -->
                <div class="kc-peek" id="peekRow">
                    <span class="kc-orb" aria-hidden="true"></span>

                    <div class="kc-peek__text">
                        <strong id="peekTitle">Halo Kak!</strong>
                        <p id="peekGreeting">
                            Mau cari produk yang cocok untuk kebutuhanmu?
                        </p>
                    </div>

                    <button
                        class="kc-send"
                        id="peekSendBtn"
                        type="button"
                        aria-label="Mulai konsultasi"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                    </button>
                </div>

                <!-- Posisi terbuka: judul dan tombol turunkan -->
                <div class="kc-chatbar">
                    <h2>Konsultasi AI</h2>

                    <button
                        class="kc-icon-btn"
                        id="chatCloseBtn"
                        type="button"
                        aria-label="Turunkan chat"
                        aria-expanded="false"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                </div>

            </div>

            <!-- Percakapan -->
            <div
                class="kc-messages"
                id="chatBox"
                role="log"
                aria-live="polite"
                aria-relevant="additions"
            ></div>

            <!-- Saran pertanyaan: 3 chip, hanya sebelum chat pertama hari ini -->
            <div
                class="kc-suggestions"
                id="chatSuggestions"
                aria-label="Saran pertanyaan"
            ></div>

            <!-- Kotak ketik bergaya asisten AI -->
            <div class="kc-composer" id="kcComposer" data-mode="chat">

                <div class="kc-attachments" id="kcAttachments" hidden></div>

                <div class="kc-composer__box">

                    <textarea
                        id="kolomKetik"
                        rows="1"
                        placeholder="Ketik pesan..."
                        aria-label="Ketik pesan"
                        enterkeyhint="send"
                        autocomplete="off"
                    ></textarea>

                    <!-- Mode agen (infrastruktur): orb menggantikan kolom ketik -->
                    <button
                        class="kc-agent"
                        id="kcAgentOrb"
                        type="button"
                        aria-label="Matikan mode agen dan kembali mengetik"
                    >
                        <span class="kc-orb" aria-hidden="true"></span>
                        <span class="kc-agent__text">
                            Mode agen aktif
                            <small>Ketuk untuk kembali mengetik</small>
                        </span>
                    </button>

                    <div class="kc-composer__bar">

                        <div class="kc-plus">
                            <button
                                class="kc-icon-btn"
                                id="btnPlus"
                                type="button"
                                aria-label="Tambah lampiran atau opsi lain"
                                aria-haspopup="menu"
                                aria-expanded="false"
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
                            </button>

                            <div class="kc-menu" id="kcPlusMenu" role="menu" hidden>

                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="attach-file">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.5l-8.5 8.5a5 5 0 0 1-7-7L14 5.500a3.500 3.500 0 0 1 5 5L10.500 19a2 2 0 0 1-3-3L15 8.500"/></svg>
                                    Foto atau dokumen
                                </button>

                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="attach-video">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h12v10H3zM15 11l6-3v8l-6-3"/></svg>
                                    Video
                                </button>

                                <button class="kc-menu__item" type="button" role="menuitem" data-kc-action="new-chat">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                                    Chat baru
                                </button>

                                <button class="kc-menu__item" id="kcAgentItem" type="button" role="menuitem" data-kc-action="agent-toggle" disabled>
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="M9 11v2M15 11v2"/></svg>
                                    Mode agen
                                    <span class="kc-menu__tag">Segera</span>
                                </button>

                            </div>
                        </div>

                        <div class="kc-composer__right">

                            <button
                                class="kc-icon-btn"
                                id="btnMic"
                                type="button"
                                aria-label="Input suara (segera hadir)"
                                disabled
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
                            </button>

                            <button
                                class="kc-send"
                                id="tombolKirim"
                                type="button"
                                aria-label="Kirim pesan"
                                disabled
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                            </button>

                        </div>
                    </div>
                </div>

                <input type="file" id="kcFileInput" multiple hidden>

            </div>

        </aside>

    </div>

    <!-- =============================================
         KONFIGURASI APLIKASI
    ============================================== -->
    <script
        type="module"
        src="./client-config.js"
    ></script>

    <!-- =============================================
         AI BRAIN
    ============================================== -->
    <script
        type="module"
        src="./js/ai-brain.js"
    ></script>

    <!-- =============================================
         CHAT PANEL CONTROLLER
    ============================================== -->
    <script
        type="module"
        src="./js/chat-sheet.js"
    ></script>

    <!-- =============================================
         CORE ENGINE
         Mengatur storefront, data, event, keranjang,
         dan pembukaan Dashboard User.
    ============================================== -->
    <script
        type="module"
        src="./js/engine.js"
    ></script>

    <!-- =============================================
         KERANJANG
    ============================================== -->
    <script
        type="module"
        src="./cart/cart.js"
    ></script>

</body>
</html>
