<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Anachronos Digital Mall — Second Brain</title>
  
  <link rel="stylesheet" href="./ax.css">
</head>
<body data-level="mall">
    <!--
        ANACHRONOS DIGITAL MALL — SECOND BRAIN (web internal, khusus owner)
        1 Kantoong (brand / talenta) = 1 neuron. Data saat ini: CONTOH.
    -->
    <div class="ax-app">
        <header class="ax-top" id="axTop"></header>

        <main class="ax-stage" id="axStage" aria-label="Second Brain Anachronos. Klik bola brand untuk masuk, seret untuk memutar, scroll untuk zoom, Esc untuk kembali.">
            <div class="ax-labels" id="axLabels" aria-hidden="true"></div>
            <aside class="ax-insp" id="axInspector" aria-label="Detail"></aside>
            <button class="cx-launch" id="cxLaunch" type="button" aria-pressed="false">◉ Aktifkan CHRONOS</button>
            <button class="cx-launch tw-launch" id="twLaunch" type="button" aria-haspopup="dialog" aria-expanded="false">⬡ Studio Twin</button>
            <button class="ax-toggle" id="axHudToggle" type="button" aria-controls="axHud" aria-expanded="true">▾ Sembunyikan panel</button>
        </main>

        <footer class="ax-hud" id="axHud"></footer>
    </div>

<script src="./ax.js"></script></body>
</html>
